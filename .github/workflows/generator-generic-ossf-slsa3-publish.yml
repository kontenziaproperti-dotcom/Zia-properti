
name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build ZIA Properti website
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          test -d dist
          zip -r zia-properti-web-dist.zip dist

      - name: Generate subject for provenance
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          sha256sum zia-properti-web-dist.zip > subjects.txt
          echo "hashes=$(base64 -w0 subjects.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts for verification
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: zia-properti-web-dist.zip
          if-no-files-found: error
          retention-days: 5    

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: true
